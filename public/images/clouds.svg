<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 500" preserveAspectRatio="xMidYMin slice">
  <defs>
    <filter id="soft" x="-20%" y="-50%" width="140%" height="200%">
      <feGaussianBlur stdDeviation="6" />
    </filter>
    <filter id="softer" x="-20%" y="-50%" width="140%" height="200%">
      <feGaussianBlur stdDeviation="12" />
    </filter>
    <radialGradient id="puff" cx="45%" cy="35%" r="65%">
      <stop offset="0" stop-color="#ffffff" />
      <stop offset=".7" stop-color="#f1f7fb" />
      <stop offset="1" stop-color="#d6e6ef" />
    </radialGradient>
  </defs>

  <!-- big cloud, top left -->
  <g filter="url(#soft)" fill="url(#puff)" opacity=".95">
    <ellipse cx="250" cy="120" rx="150" ry="48" />
    <circle cx="170" cy="100" r="52" />
    <circle cx="240" cy="78" r="66" />
    <circle cx="320" cy="96" r="50" />
    <circle cx="372" cy="118" r="36" />
    <circle cx="120" cy="122" r="34" />
  </g>

  <!-- small cloud, left of centre -->
  <g filter="url(#soft)" fill="url(#puff)" opacity=".85">
    <ellipse cx="640" cy="70" rx="80" ry="24" />
    <circle cx="600" cy="58" r="30" />
    <circle cx="650" cy="46" r="38" />
    <circle cx="700" cy="60" r="26" />
  </g>

  <!-- wispy haze -->
  <g filter="url(#softer)" fill="#ffffff" opacity=".35">
    <ellipse cx="900" cy="40" rx="220" ry="22" />
    <ellipse cx="300" cy="190" rx="260" ry="20" />
  </g>
</svg>
